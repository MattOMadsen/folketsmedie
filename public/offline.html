<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0c" />
    <meta name="robots" content="noindex" />
    <title>Offline · Folkets Medie</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0b0c;
        --text: #f2f0eb;
        --muted: #a39e94;
        --accent: #e8b84a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background:
          radial-gradient(ellipse at top, rgba(232, 184, 74, 0.08), transparent 46%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 18vh 1.5rem 3rem;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 0 1.25rem;
        border-radius: 0.85rem;
        background: #111315;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        font-weight: 650;
      }
      p { margin: 0 0 1rem; line-height: 1.55; color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        color: #111315;
        background: var(--accent);
        text-decoration: none;
        font-weight: 650;
        padding: 0.7rem 1rem;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark">FM</p>
      <h1>Du er offline</h1>
      <p>
        Folkets Medie kan ikke hente siden lige nu. Nye artikler vises, når forbindelsen er tilbage.
      </p>
      <p><a href="/folketsmedie/">Prøv igen</a></p>
    </main>
  </body>
</html>
