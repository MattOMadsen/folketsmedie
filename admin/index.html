<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0a0b0c"><title>Admin · Folkets Medie</title><link rel="icon" type="image/svg+xml" href="/folketsmedie/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"><style>:root{--bg:#0a0b0c;--bg-soft:#111315;--surface:#161a1c;--surface-2:#1c2225;--border:#2a3236;--text:#f2f0eb;--text-soft:#c8c4bb;--muted:#8b918c;--accent:#e8b84a;--accent-2:#c45c3a;--link:#9ec9a8;--radius:14px;--font:"DM Sans", system-ui, sans-serif}*{box-sizing:border-box}html,body{background:var(--bg);min-height:100%;color:var(--text);font-family:var(--font);margin:0}a{color:var(--link)}a:hover{color:var(--accent)}.admin{max-width:1100px;margin:0 auto;padding:24px 18px 80px}.admin-top{flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 20px;margin-bottom:22px;display:flex}.admin-top h1{margin:0;font-size:1.45rem;font-weight:700}.admin-top p,.hint{color:var(--muted);font-size:.92rem;line-height:1.5}.houses{background:var(--surface);border:1px solid var(--border);border-radius:999px;flex-wrap:wrap;gap:6px;margin-bottom:22px;padding:4px;display:flex}.houses button{appearance:none;color:var(--text-soft);font:inherit;cursor:pointer;background:0 0;border:0;border-radius:999px;padding:8px 14px;font-weight:600}.houses button.is-on{background:var(--accent);color:#0a0b0c}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;padding:18px}label{color:var(--muted);margin:12px 0 6px;font-size:.82rem;display:block}input,textarea,select{background:var(--bg-soft);border:1px solid var(--border);width:100%;color:var(--text);font:inherit;border-radius:10px;padding:10px 12px}textarea{min-height:140px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:.86rem;line-height:1.45}textarea.body{min-height:420px}.row{grid-template-columns:1fr 1fr;gap:12px;display:grid}@media (width<=720px){.row{grid-template-columns:1fr}}.actions{flex-wrap:wrap;gap:8px;margin-top:16px;display:flex}button.btn,a.btn{appearance:none;font:inherit;cursor:pointer;color:#0a0b0c;background:var(--accent);border:0;border-radius:10px;justify-content:center;align-items:center;padding:10px 14px;font-weight:650;text-decoration:none;display:inline-flex}button.btn.secondary,a.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}button.btn.danger{background:var(--accent-2);color:#fff}button.btn:disabled{opacity:.55;cursor:wait}.list{flex-direction:column;gap:8px;display:flex}.list button.item,.list a.item{text-align:left;background:var(--bg-soft);border:1px solid var(--border);width:100%;color:var(--text);cursor:pointer;font:inherit;border-radius:12px;padding:12px 14px;text-decoration:none}.list button.item:hover,.list a.item:hover{border-color:var(--accent)}.item-title{font-weight:650}.item-meta{color:var(--muted);margin-top:4px;font-size:.82rem}.badge{letter-spacing:.02em;vertical-align:middle;border-radius:999px;margin-left:8px;padding:2px 8px;font-size:.72rem;font-weight:700;display:inline-block}.badge.draft{color:var(--accent);background:#3a2a12}.badge.live{color:#9ec9a8;background:#163226}.status{color:var(--text-soft);margin-top:14px;font-size:.9rem}.status.err{color:#f0a090}.status.ok{color:#9ec9a8}.search{margin-bottom:12px}.login-box{max-width:520px;margin:8vh auto}code{background:var(--bg-soft);border-radius:6px;padding:1px 6px;font-size:.85em}
</style></head><body><div id="admin-root" class="admin" data-base="/folketsmedie/"></div><script src="/folketsmedie/admin/github.js"></script><script src="/folketsmedie/admin/ai.js"></script><script src="/folketsmedie/admin/app.js"></script></body></html>
